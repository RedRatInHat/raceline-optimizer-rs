[package]
name = "raceline-optimizer-cli"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Command-line racing-line optimizer for track-boundary JSON"
readme = "README.md"
keywords = ["racing-line", "trajectory", "optimization", "motorsport", "cli"]
categories = ["algorithms", "command-line-utilities", "science"]

[lib]
name = "raceline_optimizer_cli"
path = "src/lib.rs"

[[bin]]
name = "raceline-optimize"
path = "src/main.rs"

[dependencies]
raceline-optimizer = { version = "0.2.1", path = "../raceline-optimizer" }
